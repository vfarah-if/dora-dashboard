# Fails a pull request that adds a dependency with a known vulnerability (ADR 0037). Free on a public repository; a
# private one needs GitHub Code Security, and the action fails without it.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Compares the dependency graphs of the base and head commits through GitHub's API, so nothing is checked out.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
