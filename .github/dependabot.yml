# Weekly dependency updates, grouped so a quiet week is one pull request rather than many (ADR 0018).
version: 2
updates:
  # One root lockfile covers every workspace, so one entry is enough.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    # Let a new release age before proposing it, so a compromised publish is usually caught first.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    # The root pins TypeScript 5.9 for typescript-eslint, which does not support 7 yet; the workspaces build with 7.
    # Remove this once typescript-eslint supports TypeScript 7 and the root pin is dropped.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    # Dependabot puts an update in the first group that matches, so the Vitest group must stay first.
    groups:
      # Vitest and its plugins require each other at the exact same version, majors included. Bumped apart,
      # npm cannot hoist Vitest, and the jest-dom matcher types in apps/web stop resolving (ADR 0018).
      vitest:
        patterns: ["vitest", "@vitest/*"]
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
