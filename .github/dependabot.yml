# Weekly dependency updates, grouped so a quiet week is one pull request rather than many (ADR 0018).
# The npm rules below are mirrored for `make upgrade` in .ncurc.mjs (ADR 0024); change both together.
version: 2
updates:
  # One root lockfile covers every workspace, so one entry is enough.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    # Let a new release age before proposing it, so a compromised publish is usually caught first.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    ignore:
      # The root pins TypeScript 5.9 for typescript-eslint, which does not support 7 yet; the workspaces build with 7.
      # Remove this once typescript-eslint supports TypeScript 7 and the root pin is dropped.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Dependabot's lockfile leaves a separate Vitest in each workspace instead of one at the root, even when the
      # whole set moves together, and the jest-dom matchers at the root then cannot reach apps/web. Take Vitest by
      # hand with `make upgrade`, which installs it from the root and keeps it hoisted (ADR 0018).
      - dependency-name: vitest
      - dependency-name: "@vitest/*"
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
